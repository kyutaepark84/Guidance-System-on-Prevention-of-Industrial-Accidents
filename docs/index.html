<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%230b5cad%22/><path d=%22M4 8l3 3 5-6%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/></svg>">
<title>재해예방 기술지도 관리시스템</title>
</head>
<body>
<style>
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #1d2433;
  --ink-2: #4a5468;
  --ink-3: #7b8597;
  --line: #e2e6ee;
  --line-2: #eef1f6;
  --brand: #0b5cad;
  --brand-2: #e8f1fb;
  --green: #17803d;
  --green-bg: #e7f6ec;
  --orange: #b85c00;
  --orange-bg: #fff3e3;
  --red: #c42b2b;
  --red-bg: #fdecec;
  --blue: #1f63c6;
  --blue-bg: #e9f1fd;
  --purple: #6b3fb8;
  --purple-bg: #f1ebfb;
  --gray: #5d6677;
  --gray-bg: #eef0f4;
  --panel-ink: #ffffff;
  --subtle: #f7f8fb;
  --hover: #f5f8fd;
  --today: #fff8e1;
  --mine: #fff6dc;
  --hl-line: #e8c55a;
  --line-strong: #c9d0db;
  --focus: #b9d4f3;
  --brand-ink: #094c90;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: 14px;
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
a { color: var(--link, var(--brand)); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

/* common */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; }
.panel > .hd { padding: 13px 16px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 10px; }
.panel > .hd h3 { font-size: 15px; }
.panel > .hd .sub { color: var(--ink-3); font-size: 12px; }
.panel > .hd .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.panel > .bd { padding: 16px; }
.panel > .bd.np { padding: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g-side { grid-template-columns: minmax(0, 1fr) 380px; }
@media (max-width: 1100px) { .g2, .g3, .g-side { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .content { padding: 14px; } }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 6px; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--panel-ink); }
.btn.primary:hover { background: var(--brand-ink); }
.btn.danger { color: var(--red); border-color: var(--red-bg); }
.btn.success { background: var(--green); border-color: var(--green); color: #fff; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

input[type=text], input[type=number], input[type=date], input[type=month], input[type=time], input:not([type]), select, textarea {
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 7px 10px; background: var(--panel); min-width: 0;
}
textarea { width: 100%; min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); border-color: var(--brand); }
.form { display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; align-items: center; }
.form label { color: var(--ink-2); font-size: 13px; }
.form .full { grid-column: 1 / -1; }
.form input, .form select { width: 100%; }
.form input[type=checkbox] { width: auto; margin-right: 6px; }
.field-note { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.req::after { content: " *"; color: var(--red); }
.hl { background: var(--today); border-color: var(--hl-line) !important; }

table.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
.tbl th { background: var(--subtle); color: var(--ink-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.tbl tbody tr:hover { background: var(--hover); }
.tbl tr.click { cursor: pointer; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .c { text-align: center; }
.tbl-wrap { overflow-x: auto; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.mono { font-variant-numeric: tabular-nums; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-green { background: var(--green-bg); color: var(--green); }
.b-orange { background: var(--orange-bg); color: var(--orange); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-blue { background: var(--blue-bg); color: var(--blue); }
.b-purple { background: var(--purple-bg); color: var(--purple); }
.b-gray { background: var(--gray-bg); color: var(--gray); }
.b-outline { border: 1px solid var(--line); color: var(--ink-2); background: var(--panel); }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; }
.kpi .k { font-size: 12px; color: var(--ink-3); }
.kpi .v { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi.accent { border-left: 4px solid var(--brand); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 16px; border-bottom: 1px solid var(--line-2); display: flex; gap: 10px; align-items: flex-start; }
.list li:last-child { border-bottom: 0; }
.list li .grow { flex: 1; min-width: 0; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); }
.alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; display: flex; gap: 8px; align-items: flex-start; }
.alert.danger { background: var(--red-bg); color: var(--red); }
.alert.warn { background: var(--orange-bg); color: var(--orange); }
.alert.info { background: var(--blue-bg); color: var(--blue); }
.alert.ok { background: var(--green-bg); color: var(--green); }

/* stepper */
.stepper { display: flex; gap: 0; padding: 16px 12px 6px; overflow-x: auto; }
.step { flex: 1; min-width: 108px; text-align: center; position: relative; }
.step::before { content: ""; position: absolute; top: 14px; left: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.step:first-child::before { display: none; }
.step .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--panel); border: 3px solid var(--line); margin: 0 auto 6px; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.step .lb { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.step .who { font-size: 11px; color: var(--ink-3); }
.step.done .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
.step.done::before, .step.cur::before { background: var(--brand); }
.step.cur .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px var(--brand-2); }
.step.cur .lb { color: var(--ink); font-weight: 700; }
.step.skip .dot { border-style: dashed; }

.kv { display: grid; grid-template-columns: 120px 1fr; gap: 7px 12px; }
.kv dt { color: var(--ink-3); font-size: 13px; }
.kv dd { margin: 0; }
.kv-4 { grid-template-columns: 110px 1fr 110px 1fr; }
@media (max-width: 900px) { .kv-4 { grid-template-columns: 110px 1fr; } }

.task { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; background: var(--subtle); margin-bottom: 6px; }
.task.mine { background: var(--mine); border: 1px solid var(--hl-line); }
.task.urgent .t { color: var(--red); font-weight: 600; }

.action-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; background: var(--subtle); }
.action-card h4 { font-size: 14px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.action-card h4 .who { font-weight: 400; font-size: 12px; color: var(--ink-3); }

.bar { height: 10px; background: var(--gray-bg); border-radius: 6px; overflow: hidden; position: relative; min-width: 90px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 6px; }
.bar.warn > i { background: #e39b2b; }
.bar.over > i { background: var(--red); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .dh { background: var(--subtle); font-size: 12px; text-align: center; padding: 6px; color: var(--ink-2); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cal .d { min-height: 86px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 5px; font-size: 12px; background: var(--panel); }
.cal .d.out { background: var(--subtle); color: var(--ink-3); }
.cal .d.today { background: var(--today); }
.cal .d .n { font-weight: 600; margin-bottom: 3px; }
.cal .d.sun .n { color: var(--red); } .cal .d.sat .n { color: var(--blue); }
.cal .ev { display: block; border-radius: 4px; padding: 1px 5px; margin-bottom: 2px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .ev.work { background: var(--gray-bg); color: var(--ink-2); }
.cal .ev.visit { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
.cal .ev.done { background: var(--green-bg); color: var(--green); }
.cal .ev.imp { background: var(--orange-bg); color: var(--orange); }
.cal.pick .d:not(.out) { cursor: pointer; }
.cal.pick .d.sel { background: var(--brand-2); outline: 2px solid var(--brand); outline-offset: -2px; }
.cal.pick .d.dis { cursor: not-allowed; background: var(--subtle); color: var(--ink-3); }
.cal-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.cal-hd b { font-size: 15px; min-width: 90px; text-align: center; }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 14px 14px; }
.timeline li::before { content: ""; position: absolute; left: -21px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--brand); }
.timeline li.sys::before { background: #9aa6b8; box-shadow: 0 0 0 1px #9aa6b8; }
.timeline .meta { font-size: 12px; color: var(--ink-3); }
.timeline .note { font-size: 12.5px; color: var(--ink-2); white-space: pre-wrap; margin-top: 2px; }

/* modal & toast */
.modal-bg { position: fixed; inset: 0; background: rgba(15, 25, 45, .45); display: flex; align-items: flex-start; justify-content: center; z-index: 100; overflow-y: auto; padding: 40px 16px; }
.modal { background: var(--panel); border-radius: 10px; width: 100%; max-width: 860px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal .hd { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.modal .hd h3 { font-size: 16px; }
.modal .hd .x { margin-left: auto; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--ink-3); }
.modal .bd { padding: 20px; }
.modal .ft { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
#toast-root { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #1d2433; color: #fff; padding: 11px 16px; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,.2); max-width: 420px; white-space: pre-wrap; animation: fadein .2s; }
.toast.err { background: #a52222; }
.toast.ok { background: #136b33; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.dropzone { border: 2px dashed var(--line-strong); border-radius: 10px; padding: 26px; text-align: center; background: var(--subtle); cursor: pointer; }
.dropzone.over { background: var(--brand-2); border-color: var(--brand); }
.evidence { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preview-box { padding: 12px 14px; border-radius: 8px; margin-top: 6px; }

/* login */
.login { max-width: 980px; margin: 50px auto; padding: 0 16px; }
.login h1 { font-size: 24px; margin-bottom: 6px; }
.login .desc { color: var(--ink-2); margin-bottom: 24px; line-height: 1.6; }
.role-group { margin-bottom: 18px; }
.role-group h4 { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.user-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.user-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; box-shadow: var(--shadow); }
.user-card:hover { border-color: var(--brand); }
.user-card b { display: block; }
.user-card span { font-size: 12px; color: var(--ink-3); }

/* flow */
.flow { display: grid; grid-template-columns: 110px repeat(5, minmax(120px, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; }
.flow .lane-h { background: #0f2747; color: #fff; text-align: center; padding: 9px 4px; font-weight: 600; }
.flow .stage { background: var(--subtle); padding: 10px 8px; font-weight: 700; color: var(--ink-2); border-top: 1px solid var(--line); display: flex; align-items: center; }
.flow .cell { border-top: 1px solid var(--line); border-left: 1px dashed var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.flow .box { background: var(--panel); border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; text-align: center; }
.flow .box.sys { border-color: var(--green); background: var(--green-bg); }
.flow .box.dec { border-color: var(--orange); background: var(--orange-bg); }
.flow .box.end { border-radius: 20px; border-color: var(--ink-3); background: var(--gray-bg); }
.flow .box.out { border-style: dashed; color: var(--ink-3); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs a { padding: 8px 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs a.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; text-decoration: none; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mail-body { white-space: pre-wrap; background: var(--subtle); padding: 12px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
.unread { font-weight: 700; }
.chip-files a { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px; background: var(--gray-bg); border-radius: 4px; font-size: 12px; }


/* ───────── 사내 표준 화면 스킨 (상단 GNB · 메뉴바 · 열린 화면 탭 · 포틀릿) ───────── */
:root {
  --bg: #ffffff; --panel: #ffffff; --ink: #333333; --ink-2: #555555; --ink-3: #8a8a8a;
  --line: #d4d4d4; --line-2: #e6e6e6; --line-strong: #bdbdbd;
  --brand: #f37321; --brand-2: #fff2e9; --brand-ink: #d9600f; --link: #2a5aa8;
  --gnb: #2d2d2d; --gnb-2: #3b3b3b; --gnb-ink: #f2f2f2; --tabbar: #f4f4f4; --quick: #e9e9e9;
  --subtle: #f6f6f6; --hover: #fbf6f2; --today: #fff8e6; --mine: #fff4e5; --hl-line: #f0b37e; --focus: #f8c9a6;
  --radius: 2px; --shadow: none;
  color-scheme: light;
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 13px;
}
a { color: var(--link); }
.srm { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }

.gnb { background: var(--gnb); color: var(--gnb-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; }
.gnb-top { display: flex; align-items: center; gap: 12px; padding: 6px 14px 4px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--gnb-ink); text-decoration: none; font-weight: 700; }
.brand:hover { text-decoration: none; }
.brand-mark { display: inline-flex; }
.brand-co { font-size: 15px; letter-spacing: -.2px; }
.brand-sep { width: 1px; height: 14px; background: #777; }
.brand-sys { font-size: 14px; }
.brand-demo { font-size: 10px; font-weight: 700; color: var(--brand); border: 1px solid var(--brand); padding: 0 4px; border-radius: 2px; letter-spacing: .5px; }
.gnb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.menu-search { display: flex; align-items: center; background: #1f1f1f; border: 1px solid #555; border-radius: 2px; padding: 0 6px; }
.menu-search input { background: transparent; border: 0; color: var(--gnb-ink); width: 190px; padding: 4px 2px; font-size: 12px; }
.menu-search input::placeholder { color: #999; }
.menu-search input:focus { outline: none; }
.menu-search .ico { color: #bbb; font-size: 14px; }
.clock { background: #fff; color: #222; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-variant-numeric: tabular-nums; border: 2px solid #4a7bd0; }
.clock.sim { border-color: var(--brand); color: var(--brand-ink); font-weight: 700; }
.gnb-user { font-size: 12px; color: #ddd; }
.gnb-select { background: #1f1f1f !important; color: var(--gnb-ink) !important; border: 1px solid #555 !important; border-radius: 2px !important; padding: 3px 6px !important; font-size: 12px; max-width: 230px; }
.gnb-btn { background: #4a4a4a; color: #eee; border: 1px solid #5a5a5a; border-radius: 2px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.gnb-btn:hover { background: #555; }
.gnb-menu { display: flex; gap: 2px; padding: 0 10px; border-bottom: 3px solid var(--brand); overflow-x: auto; scrollbar-width: none; }
.gnb-menu a { color: var(--gnb-ink); padding: 7px 14px 8px; font-size: 13px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 5px; border-bottom: 3px solid transparent; margin-bottom: -3px; }
.gnb-menu a:hover { color: #fff; background: var(--gnb-2); text-decoration: none; }
.gnb-menu a.active { color: #fff; border-bottom-color: #fff; background: var(--gnb-2); }
.nav-badge { background: #e5484d; color: #fff; border-radius: 9px; font-size: 10px; padding: 0 6px; line-height: 16px; }

.tabbar { display: flex; align-items: stretch; background: var(--tabbar); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; min-height: 26px; }
.tab-edge { background: #555; color: #fff; width: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.tab { display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; font-size: 11.5px; color: var(--ink-3); border-right: 1px solid var(--line); white-space: nowrap; }
.tab a, a.tab { color: var(--ink-3); text-decoration: none; }
.tab.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--brand); }
.tab.on a { color: var(--ink); }
.tab-x { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 0 2px; font-size: 12px; }
.tab-x:hover { color: var(--red); }

.body-wrap { display: flex; flex: 1; min-height: 0; }
.quick { width: 18px; flex: none; background: var(--quick); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; color: #888; font-size: 12px; }
.content { padding: 12px 16px 24px; flex: 1; min-width: 0; max-width: none; width: auto; }
.page-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.page-title h2 { font-size: 16px; text-wrap: balance; }
.page-title .crumb { font-size: 11.5px; color: var(--ink-3); }
.page-foot { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line-2); color: var(--ink-3); font-size: 11.5px; display: flex; gap: 16px; flex-wrap: wrap; }
.page-foot div { margin: 0 !important; color: var(--ink-2) !important; }

/* 포틀릿 */

// 재해예방 기술지도 업무 흐름(상태 머신)  — Ver.2 (1차 TEST 리뷰 반영)

//      │  ├─ 만료 안내(일반 D-10 / 단가 D-30) · 15일 주기 점검(스케줄러)
//      │  └─ 연장 → EXTENSION (구매: 계약서 갱신 → 협력업체: 산재가입증명서 갱신 → 기관: 추가계약서) → ACTIVE

const store = require('./db');
const dates = require('./dates');

const DATA_VERSION = 2;

const STATUS = {

  MONITORING: { label: '누계 관리(대상 아님)', step: 1, color: 'blue' },
  DOCS_REQUESTED: { label: '서류 제출 대기', step: 3, color: 'orange' },
  DOCS_SUBMITTED: { label: '기술지도 계약서 제출 대기', step: 4, color: 'orange' },

const VISIT_STATUS = {

  DONE: '지도 완료',

const CONTACT_ROLES = ['PURCHASE', 'PARTNER_MGMT', 'SAFETY', 'AGENCY', 'CONTRACTOR'];

// 기술지도 미실시(주기 초과) 사유

}

function log(p, actor, action, label, note) {

const SYSTEM = { id: 'system', name: '시스템(자동)', role: 'SYSTEM' };

  if (role === 'PARTNER_MGMT') return p.deptId;

// body의 contact_<ROLE>, new_<ROLE>_name/phone/email 를 반영하고 바뀐 역할 목록을 돌려준다

// ───────────────────────── 공사 등록 ─────────────────────────

function validateProjectFields(f) {

    id: store.id('p'),
    contractNo: fields.contractNo || '',
    name: fields.name.trim(),
    type: fields.type,
    companyId: company.id,
    companyName: company.name,
    startDate: fields.startDate,
    endDate: fields.endDate,
    amount: Math.round(Number(fields.amount)),
    deptId: fields.deptId,
    managerUserId: null,
    agencyId: fields.agencyId || null,
    contacts: {},
    status: null,
    workDays: [],
    visits: [],
    extensions: [],
    gapReasons: {},
    flags: {},
    history: [],
    createdAt: new Date().toISOString(),
    createdBy: actor.id,
  };
  if (!p.agencyId && settings().defaultAgencyId) p.agencyId = settings().defaultAgencyId;
  // 담당자: 구매(등록자), 협력업체 관리부서, 그 밖에 등록 화면에서 지정한 담당자
  const body = { ...fields };
  if (actor.role === 'PURCHASE' && !body.contact_PURCHASE) body.contact_PURCHASE = actor.id;
  if (fields.managerUserId && !body.contact_PARTNER_MGMT) body.contact_PARTNER_MGMT = fields.managerUserId;
  applyContacts(p, body, CONTACT_ROLES);

    const rec = store.storeFile(contractFile.buf, { originalName: contractFile.originalName, mime: contractFile.mime, projectId: p.id, category: 'PURCHASE_CONTRACT', ref: 'REGISTER', uploadedBy: actor.id });
    p.contractFileId = rec.id;
  }

// ───────────────────────── 권한 ─────────────────────────

function canSee(user, p) {
  if (!user) return false;
  if (user.role === 'CONTRACTOR') return p.companyId === user.orgId;
  if (user.role === 'AGENCY') return !!p.agencyId && p.agencyId === user.orgId;
  return true;
}

function checkActor(actor, p, roles) {
  if (actor.role === 'ADMIN') return;
  if (!roles.includes(actor.role)) {
    throw new WfError(`이 작업은 ${roles.map((r) => notify.ROLE_LABEL[r]).join('/')}만 수행할 수 있습니다.`, 403);
  }
  if (actor.role === 'CONTRACTOR' && p.companyId !== actor.orgId) throw new WfError('해당 공사의 협력업체 사용자만 수행할 수 있습니다.', 403);
  if (actor.role === 'AGENCY' && p.agencyId !== actor.orgId) throw new WfError('해당 공사에 지정된 기술지도기관만 수행할 수 있습니다.', 403);
}

function checkStatus(p, statuses) {
  if (!statuses.includes(p.status)) {
    throw new WfError(`현재 상태(${STATUS[p.status]?.label || p.status})에서는 수행할 수 없는 작업입니다.`);
  }
}

// ───────────────────────── 유틸 ─────────────────────────

function saveFiles(p, files, actor, category, ref) {
  return (files || []).map((f) => store.storeFile(f.buf, {
    originalName: f.originalName, mime: f.mime, projectId: p.id,
    category: f.category || category, ref, uploadedBy: actor.id,
  }));
}

function ALL4() { return ['PARTNER_MGMT', 'CONTRACTOR', 'AGENCY', 'SAFETY']; }

function findVisit(p, visitId) {
  const v = (p.visits || []).find((x) => x.id === visitId);
  if (!v) throw new WfError('기술지도 일정을 찾을 수 없습니다.');
  return v;
}

const visitDate = (v) => v.actualDate || v.plannedDate;

// 회차는 날짜 순서로 다시 매긴다(앞선 회차보다 빠른 일정을 잡으면 회차가 바뀜)
function renumberVisits(p) {
  const live = (p.visits || []).filter((v) => v.status !== 'CANCELED').sort((a, b) => visitDate(a).localeCompare(visitDate(b)));
  live.forEach((v, i) => { v.round = i + 1; });
  p.visits = [...live, ...(p.visits || []).filter((v) => v.status === 'CANCELED')];
}

function heldDates(p) {
  return (p.visits || []).filter((v) => VISIT_HELD.includes(v.status) && v.actualDate).map((v) => v.actualDate).sort();
}

function lastHeldDate(p) {
  const h = heldDates(p);
  return h.length ? h[h.length - 1] : null;
}

// 15일 주기 점검 정보
function cycleInfo(p, t = today()) {
  if (!['ACTIVE', 'EXTENSION'].includes(p.status) || !p.guidancePeriod) return null;
  const s = settings();
  const last = lastHeldDate(p);
  const anchor = last || p.guidancePeriod.start;
  const nextDue = dates.addDays(anchor, s.cycleDays);
  const upcoming = (p.visits || []).filter((v) => v.status === 'SCHEDULED').map((v) => v.plannedDate).sort()[0] || null;
  const daysLeft = dates.diffDays(t, nextDue);
  let level = 'ok';
  if (t > p.guidancePeriod.end) level = 'expired';
  else if (daysLeft < 0 && !(upcoming && upcoming <= t)) level = 'overdue';
  else if (!upcoming && daysLeft <= s.cycleDays - s.cycleRemindDays) level = 'warn';
  else if (upcoming && upcoming > nextDue) level = 'warn';
  return { last, anchor, nextDue, daysLeft, upcoming, level, endIn: dates.diffDays(t, p.guidancePeriod.end) };
}

// 주기 초과(미실시) 구간: 직전 지도일(또는 개시일)+주기 기한을 넘겨 지도한 구간, 또는 현재 초과 중인 구간
function cycleGaps(p, t = today()) {
  if (!p.guidancePeriod || !['ACTIVE', 'EXTENSION', 'CLOSED'].includes(p.status)) return [];
  const s = settings();
  const end = p.closed ? (p.closed.completionDate < p.guidancePeriod.end ? p.closed.completionDate : p.guidancePeriod.end) : p.guidancePeriod.end;
  const gaps = [];
  let prev = p.guidancePeriod.start;
  for (const d of heldDates(p)) {
    const due = dates.addDays(prev, s.cycleDays);
    if (d > due && due <= end) gaps.push({ from: prev, due, until: d, ongoing: false });
    prev = d;
  }
  const due = dates.addDays(prev, s.cycleDays);
  const limit = t < end ? t : end;
  if (due < limit && p.status !== 'CLOSED') gaps.push({ from: prev, due, until: null, ongoing: true });
  else if (due < end && p.status === 'CLOSED') gaps.push({ from: prev, due, until: null, ongoing: false });
  const reasons = p.gapReasons || {};
  return gaps.map((g) => ({ ...g, month: g.due.slice(0, 7), reason: reasons[g.due] || null }));
}

// 현재 해야 할 일(Ball-in-court)
function tasks(p, t = today()) {
  const out = [];
  const add = (role, label, urgent = false) => out.push({ role, label, urgent });
  const s = settings();
  const inFlow = ['DOCS_REQUESTED', 'DOCS_SUBMITTED', 'ACTIVE', 'EXTENSION'].includes(p.status);
  if (inFlow) {
    const missing = ['SAFETY', 'AGENCY', 'CONTRACTOR'].filter((r) => !contactName(p, r));
    if (missing.length) add('PARTNER_MGMT', `담당자 지정 필요 — ${missing.map((r) => notify.ROLE_LABEL[r]).join(', ')} (미지정 시 소속 전체에 안내)`);
  }
  switch (p.status) {
    case 'MONITORING':
      if (p.judgment && p.judgment.warning) add('PARTNER_MGMT', '단가계약 누계 주의 — 작업 세분화 또는 기술지도 계약 준비 검토', true);
      break;
    case 'DOCS_REQUESTED':
      if (!p.agencyId) add('PARTNER_MGMT', '기술지도기관 지정 필요', true);
      add('CONTRACTOR', '산재보험 가입증명서 Upload 및 제출');
      break;
    case 'DOCS_SUBMITTED':
      add('AGENCY', '기술지도 계약서 제출 → 기술지도 개시');
      break;
    case 'ACTIVE':
    case 'EXTENSION': {
      const futureWork = (p.workDays || []).filter((d) => d >= t);
      const scheduled = (p.visits || []).filter((v) => v.status === 'SCHEDULED');
      if (!futureWork.length && !scheduled.length) add('CONTRACTOR', '월별 작업일자 지정');
      if (futureWork.length && !scheduled.length) add('AGENCY', '작업일자 중 기술지도 일자 선택');
      for (const v of scheduled) if (v.plannedDate <= t) add('AGENCY', `기술지도 결과보고서 제출 (${v.plannedDate})`, true);
      const c = cycleInfo(p, t);
      if (c && c.level === 'overdue') add('AGENCY', `기술지도 주기(${s.cycleDays}일) 경과 — 즉시 지도 필요 (기한 ${c.nextDue})`, true);
      const days = endNoticeDaysFor(p, s);
      if (p.status === 'ACTIVE' && c && c.endIn <= days) {
        add('PARTNER_MGMT', c.endIn < 0 ? '기술지도 기간 만료 — 종결 또는 연장 조치' : `기간 만료 D-${c.endIn} — 현장 완료 시 종결, 필요 시 연장`, true);
      }
      if (p.status === 'EXTENSION' && p.extension) {
        const st = p.extension.step;
        if (st === 'PURCHASE') add('PURCHASE', '연장 계약서 갱신 Upload' + (p.type === 'UNIT_PRICE' ? ' (가계약서/본계약서)' : ''), true);
        if (st === 'CONTRACTOR') add('CONTRACTOR', '연장 관련서류 제출 (산재가입증명서 갱신)', true);
        if (st === 'AGENCY') add('AGENCY', '기술지도 추가계약서 제출', true);
      }
      break;
    }
    default:
  }
  for (const g of cycleGaps(p, t)) if (!g.reason) add('CONTRACTOR', `기술지도 미실시(주기 초과) 사유 작성 — 기한 ${g.due}`, true);
  return out;
}

const OPEN = Object.keys(STATUS).filter((s) => s !== 'CLOSED');
const truthy = (v) => v === true || v === 'true' || v === 'on';

const ACTIONS = {
  update_info: {
    label: '공사 정보 수정',
    roles: ['PURCHASE', 'PARTNER_MGMT'],
    statuses: OPEN,
    run(p, { actor, body }) {
      const db = store.get();
      const f = { ...p, ...pick(body, ['name', 'contractNo', 'type', 'startDate', 'endDate', 'amount']) };
      if (typeof f.amount === 'string') f.amount = f.amount.replace(/[,\s원]/g, '');
      if (body.companyName && body.companyName !== p.companyName) { f.companyId = null; f.companyName = body.companyName; }
      validateProjectFields(f);
      if (f.contractNo && db.projects.some((x) => x.id !== p.id && x.contractNo === f.contractNo)) throw new WfError(`이미 등록된 계약번호입니다: ${f.contractNo}`);
      const c = resolveCompany(f);
      const changes = [];
      for (const k of ['name', 'contractNo', 'type', 'startDate', 'endDate']) if (String(f[k] ?? '') !== String(p[k] ?? '')) changes.push(k);
      if (Math.round(Number(f.amount)) !== p.amount) changes.push('amount');
      if (c.id !== p.companyId) {
        changes.push('company');
        if (p.contacts) p.contacts.CONTRACTOR = null;
      }
      Object.assign(p, pick(f, ['name', 'contractNo', 'type', 'startDate', 'endDate']), { amount: Math.round(Number(f.amount)), companyId: c.id, companyName: c.name });
      if ('deptId' in body && body.deptId !== p.deptId) {
        if (!db.departments.some((d) => d.id === body.deptId && d.kind === 'PARTNER_MGMT')) throw new WfError('협력업체 관리부서를 올바르게 선택해 주세요.');
        p.deptId = body.deptId;
        changes.push('dept');
      }
      if (p.guidancePeriod && ['DOCS_REQUESTED', 'DOCS_SUBMITTED'].includes(p.status)) p.guidancePeriod.end = p.endDate;
      log(p, actor, 'UPDATED', '공사 정보 수정', `${changes.length ? `변경: ${changes.join(', ')}` : '변경 없음'}${body.note ? ` / ${body.note}` : ''}`);
      applyJudgment(p, actor);
    },
  },

  assign: {
    label: '담당자·기술지도기관 지정',
    roles: ['PURCHASE', 'PARTNER_MGMT', 'SAFETY', 'AGENCY', 'CONTRACTOR'],
    statuses: OPEN,
    run(p, { actor, body }) {
      const db = store.get();
      const beforeAgency = p.agencyId;
      // 협력업체·기관 사용자는 자기 소속 담당자만 지정
      const own = actor.role === 'CONTRACTOR' || actor.role === 'AGENCY';
      if (!own) {
        if ('deptId' in body && body.deptId && body.deptId !== p.deptId) {
          if (!db.departments.some((d) => d.id === body.deptId && d.kind === 'PARTNER_MGMT')) throw new WfError('협력업체 관리부서를 올바르게 선택해 주세요.');
          p.deptId = body.deptId;
        }
        if ('agencyId' in body && (body.agencyId || null) !== (p.agencyId || null)) {
          if (body.agencyId && !db.agencies.find((a) => a.id === body.agencyId)) throw new WfError('등록되지 않은 기술지도기관입니다.');
          if (['ACTIVE', 'EXTENSION'].includes(p.status)) throw new WfError('기술지도 진행 중에는 기관을 변경할 수 없습니다.');
          p.agencyId = body.agencyId || null;
          if (p.contacts) p.contacts.AGENCY = null;
        }
      }
      const roles = own ? [actor.role] : CONTACT_ROLES;
      const changed = applyContacts(p, body, roles);
      const ag = db.agencies.find((a) => a.id === p.agencyId);
      const desc = CONTACT_ROLES.map((r) => { const u = contactName(p, r); return u ? `${notify.ROLE_LABEL[r]}: ${u.name}` : null; }).filter(Boolean);
      log(p, actor, 'ASSIGNED', '담당자·기술지도기관 지정', [ag ? `기관: ${ag.name}` : '기관 미지정', ...desc].join(' / '));
      // 이미 대상 안내가 나간 단계라면 새로 지정된 담당자에게 안내를 다시 보낸다
      const resend = changed.filter((r) => r !== 'PURCHASE');
      if (p.agencyId !== beforeAgency && p.agencyId && !resend.includes('AGENCY')) resend.push('AGENCY');
      if (resend.length && ['DOCS_REQUESTED', 'DOCS_SUBMITTED'].includes(p.status)) {
        sendTargetNotice(p, resend, `신규 지정 담당자에게 대상 안내 발송 (${resend.map((r) => notify.ROLE_LABEL[r]).join(', ')})`);
      }
    },
  },

  submit_docs: {
    label: '서류 제출',
    roles: ['CONTRACTOR'],
    statuses: ['DOCS_REQUESTED'],
    run(p, { actor, body, files }) {
      const db = store.get();

      const have = new Set([...db.files.filter((f) => f.projectId === p.id && f.ref === 'DOCS').map((f) => f.category), ...incoming.map((f) => f.category)]);
      const missing = DOC_TYPES.filter((d) => d.required && !have.has(d.key)).map((d) => d.label);
      if (missing.length) throw new WfError(`${missing.join(', ')} 파일을 첨부해 주세요.`);
      if (!p.agencyId) throw new WfError('기술지도기관이 지정되지 않았습니다. 협력업체 관리부서에 기관 지정을 요청해 주세요.');
      const recs = saveFiles(p, incoming, actor, 'INSURANCE', 'DOCS');
      p.status = 'DOCS_SUBMITTED';
      p.docsSubmittedAt = today();
      log(p, actor, 'DOCS_SUBMITTED', '기술지도기관에 서류 제출', `${recs.map((r) => r.originalName).join(', ')}${p.contractFileId ? ' + 공사 계약서(등록 시 첨부분)' : ''}${body.note ? ` / ${body.note}` : ''}`);
      notifyAndLog(p, 'DOCS_SUBMITTED', ['AGENCY', 'PARTNER_MGMT'], {

          : '협력업체가 기술지도 관련 서류를 제출하였습니다. 기술지도기관의 계약서 제출을 기다리는 중입니다.',
        sms: (role) => role === 'AGENCY' ? '서류 제출됨 - 기술지도 계약서 제출 요망' : '협력업체 서류 제출 완료',
      });
    },
  },

  submit_tg_contract: {
    label: '기술지도 개시(계약서 제출)',
    roles: ['AGENCY'],
    statuses: ['DOCS_SUBMITTED'],
    run(p, { actor, body, files }) {
      if (!files || !files.length) throw new WfError('기술지도 계약서 파일을 첨부해 주세요.');
      const gs = body.guidanceStart || p.guidancePeriod.start;
      const ge = body.guidanceEnd || p.guidancePeriod.end;
      if (!dates.isValid(gs) || !dates.isValid(ge) || gs > ge) throw new WfError('기술지도 계약기간을 확인해 주세요.');
      if (body.contractDate && !dates.isValid(body.contractDate)) throw new WfError('계약일자를 확인해 주세요.');
      saveFiles(p, files, actor, 'TG_CONTRACT', 'TG_CONTRACT');
      p.guidancePeriod = { start: gs, end: ge };
      p.tgContract = {
        contractDate: body.contractDate || today(),
        plannedCount: Number(body.plannedCount) || Math.max(1, Math.ceil((dates.diffDays(gs, ge) + 1) / settings().cycleDays)),
        moelSubmitted: truthy(body.moelSubmitted),
      };
      p.status = 'ACTIVE';
      log(p, actor, 'TG_CONTRACT', '기술지도 계약서 제출 → 기술지도 개시', `계약일 ${p.tgContract.contractDate}, 기간 ${gs} ~ ${ge}, ${p.tgContract.plannedCount}회, 고용노동부 시스템 등록 ${p.tgContract.moelSubmitted ? '완료' : '미등록'}`);
      notifyAndLog(p, 'GUIDANCE_STARTED', ALL4(), {
        subject: '재해예방 기술지도 계약 체결 및 개시 안내',
        body: (role) => {
          const base = `기술지도기관이 기술지도 계약서를 제출하여 기술지도가 개시되었습니다.\n기술지도 기간: ${gs} ~ ${ge} (${p.tgContract.plannedCount}회, ${settings().cycleDays}일 1회 이상)`;
          if (role === 'CONTRACTOR') return `${base}\n\n[협력업체 조치사항] 관리시스템에 월별 작업일자를 지정해 주시기 바랍니다.`;
          return base;
        },
        sms: (role) => role === 'CONTRACTOR' ? '기술지도 개시 - 월별 작업일자 지정 요망' : '재해예방 기술지도 개시',
      });

  },

  set_moel: {
    label: '고용노동부 시스템 등록 여부',
    roles: ['AGENCY'],
    statuses: ['ACTIVE', 'EXTENSION', 'CLOSED'],
    run(p, { actor, body }) {
      p.tgContract = { ...(p.tgContract || {}), moelSubmitted: truthy(body.moelSubmitted) };
      log(p, actor, 'MOEL', `고용노동부 시스템 기술지도 계약 등록: ${p.tgContract.moelSubmitted ? '완료' : '미등록'}`);
    },
  },

  set_work_days: {
    label: '월별 작업일자 지정',
    roles: ['CONTRACTOR', 'PARTNER_MGMT'],
    statuses: ['ACTIVE', 'EXTENSION'],
    run(p, { actor, body }) {
      const month = body.month;
      if (!/^\d{4}-\d{2}$/.test(month || '')) throw new WfError('대상 월을 선택해 주세요.');
      const days = String(body.days || '').split(',').map((x) => x.trim()).filter(Boolean);
      for (const d of days) {
        if (!dates.isValid(d) || !d.startsWith(month)) throw new WfError(`작업일자 형식 오류: ${d}`);
        if (d < p.guidancePeriod.start || d > p.guidancePeriod.end) throw new WfError(`작업일자 ${d}가 기술지도 기간(${p.guidancePeriod.start} ~ ${p.guidancePeriod.end}) 밖입니다.`);
      }
      p.workDays = [...(p.workDays || []).filter((d) => !d.startsWith(month)), ...days].sort();
      log(p, actor, 'WORK_DAYS', `${month} 작업일자 지정`, `${days.length}일: ${days.map((d) => d.slice(8)).join(', ')}일`);
      if (days.length) {
        notifyAndLog(p, 'WORK_DAYS', ['AGENCY'], {
          subject: `${month} 작업일자 지정 안내`,
          body: `협력업체가 ${month} 작업일자(${days.length}일)를 지정하였습니다.\n작업일: ${days.join(', ')}\n\n작업일자 중 기술지도 가능 일자를 관리시스템에서 선택해 주시기 바랍니다.`,
          sms: `${month} 작업일 지정 - 기술지도 일자 선택 요망`,
        });

    },
  },

  schedule_visit: {
    label: '기술지도 일자 선택',
    roles: ['AGENCY'],
    statuses: ['ACTIVE', 'EXTENSION'],
    run(p, { actor, body }) {
      const d = body.date;
      if (!dates.isValid(d)) throw new WfError('기술지도 일자를 선택해 주세요.');
      if (!(p.workDays || []).includes(d)) throw new WfError('협력업체가 지정한 작업일자 중에서 선택해 주세요.');
      if ((p.visits || []).some((v) => visitDate(v) === d && v.status !== 'CANCELED')) throw new WfError('이미 같은 날짜에 기술지도 일정이 있습니다.');
      const v = { id: store.id('v'), round: 0, plannedDate: d, time: body.time || '', inspector: body.inspector || actor.name, status: 'SCHEDULED', createdAt: today() };
      p.visits = [...(p.visits || []), v];
      const before = Object.fromEntries((p.visits || []).map((x) => [x.id, x.round]));
      renumberVisits(p);
      const moved = p.visits.filter((x) => x.id !== v.id && x.status !== 'CANCELED' && before[x.id] && before[x.id] !== x.round);
      log(p, actor, 'VISIT_SCHEDULED', `${v.round}회차 기술지도 일자 지정`, `${d} ${v.time} / 지도요원 ${v.inspector}${moved.length ? ` (회차 조정: ${moved.map((x) => `${visitDate(x)} → ${x.round}회차`).join(', ')})` : ''}`);
      notifyAndLog(p, 'VISIT_SCHEDULED', ALL4(), {
        subject: `${v.round}회차 기술지도 지정일 안내`,
        body: `재해예방 기술지도 일자가 지정되었습니다.\n - 지도일자: ${d} ${v.time}\n - 지도요원: ${v.inspector}\n - 회차: ${v.round}회차${moved.length ? `\n - 회차 조정: ${moved.map((x) => `${visitDate(x)} → ${x.round}회차`).join(', ')}` : ''}\n\n협력업체는 현장 기술지도에 협조해 주시기 바랍니다.`,
        sms: `기술지도 지정일 ${d} ${v.time} (${v.round}회차)`,
      });
    },
  },

  cancel_visit: {
    label: '기술지도 일정 취소',
    roles: ['AGENCY'],
    statuses: ['ACTIVE', 'EXTENSION'],
    run(p, { actor, body }) {
      const v = findVisit(p, body.visitId);
      if (v.status !== 'SCHEDULED') throw new WfError('예정 상태인 일정만 취소할 수 있습니다.');
      const round = v.round;
      v.status = 'CANCELED';
      v.cancelNote = body.note || '';
      renumberVisits(p);
      log(p, actor, 'VISIT_CANCELED', `${round}회차 기술지도 일정 취소`, `${v.plannedDate} ${body.note || ''}`);
      notifyAndLog(p, 'VISIT_CANCELED', ALL4(), {
        subject: '기술지도 일정 취소 안내',
        body: `${v.plannedDate} 기술지도 일정이 취소되었습니다.\n사유: ${body.note || '-'}\n재지정 일정은 추후 안내됩니다.`,
        sms: `기술지도 ${v.plannedDate} 일정 취소`,
      });
    },
  },

  submit_result: {
    label: '기술지도 결과보고서 제출',
    roles: ['AGENCY'],
    statuses: ['ACTIVE', 'EXTENSION'],
    run(p, { actor, body, files }) {
      const v = findVisit(p, body.visitId);
      if (v.status !== 'SCHEDULED') throw new WfError('예정 상태인 일정에만 결과를 제출할 수 있습니다.');
      const ad = body.actualDate || v.plannedDate;
      if (!dates.isValid(ad)) throw new WfError('실제 지도일자를 확인해 주세요.');
      if (ad > today()) throw new WfError('미래 일자의 결과는 제출할 수 없습니다. (현장 방문 후 제출)');
      if (!files || !files.length) throw new WfError('기술지도 결과보고서 파일을 첨부해 주세요.');
      if ((p.visits || []).some((x) => x.id !== v.id && x.status !== 'CANCELED' && visitDate(x) === ad)) throw new WfError(`${ad}에 이미 다른 기술지도 기록이 있습니다.`);
      const recs = saveFiles(p, files, actor, 'TG_RESULT', v.id);
      Object.assign(v, { actualDate: ad, resultFiles: recs.map((r) => r.id), resultAt: today(), status: 'DONE' });

      log(p, actor, 'RESULT', `${v.round}회차 기술지도 결과보고서 제출`, `지도일 ${ad} / ${recs.map((r) => r.originalName).join(', ')}`);

        sms: `${v.round}회차 기술지도 결과보고서 등록`,
      });
    },
  },

  gap_reason: {
    label: '기술지도 미실시(주기 초과) 사유 작성',
    roles: ['CONTRACTOR', 'PARTNER_MGMT'],
    statuses: ['ACTIVE', 'EXTENSION', 'CLOSED'],
    run(p, { actor, body }) {
      const g = cycleGaps(p).find((x) => x.due === body.due);
      if (!g) throw new WfError('해당 주기 초과 구간을 찾을 수 없습니다.');
      if (!GAP_REASONS[body.code]) throw new WfError('미실시 사유를 선택해 주세요.');
      const text = String(body.text || '').trim();
      if (body.code === 'ETC' && !text) throw new WfError('기타 사유를 입력해 주세요.');
      p.gapReasons = { ...(p.gapReasons || {}), [g.due]: { code: body.code, label: GAP_REASONS[body.code], text, by: actor.name, at: today() } };
      log(p, actor, 'GAP_REASON', `기술지도 미실시 사유 등록 (기한 ${g.due})`, `${GAP_REASONS[body.code]}${text ? `: ${text}` : ''}`);
    },
  },

  close: {
    label: '종결 조치(현장공사 완료)',
    roles: ['PARTNER_MGMT'],
    statuses: ['ACTIVE'],
    run(p, { actor, body }) {
      const open = (p.visits || []).filter((v) => v.status === 'SCHEDULED');
      if (open.length && !truthy(body.force)) {
        throw new WfError(`예정된 기술지도 일정이 ${open.length}건 있습니다(${open.map((v) => `${v.round}회차 ${v.plannedDate}`).join(', ')}). 결과 제출 후 종결하거나 '예정 일정 취소 후 종결'을 선택해 주세요.`);
      }
      const cd = body.completionDate || today();
      if (!dates.isValid(cd)) throw new WfError('현장공사 완료일을 확인해 주세요.');
      for (const v of open) v.status = 'CANCELED';
      renumberVisits(p);
      p.status = 'CLOSED';
      p.closed = { completionDate: cd, at: today(), by: actor.name, note: body.note || '' };
      const held = (p.visits || []).filter((v) => VISIT_HELD.includes(v.status)).length;
      log(p, actor, 'CLOSED', '현장공사 완료 — 기술지도 종결', `완료일 ${cd}, 기술지도 실시 ${held}회 ${body.note || ''}`);
      notifyAndLog(p, 'CLOSED', [...ALL4(), 'PURCHASE'], {
        subject: '재해예방 기술지도 종결 안내',
        body: (role) => `현장공사 완료(${cd})에 따라 재해예방 기술지도가 종결되었습니다. (기술지도 실시 ${held}회)` +
          (role === 'AGENCY' ? '\n\n기술지도 비용계산서는 별도 정산 시스템 절차에 따라 발급해 주시기 바랍니다.' : ''),
        sms: '재해예방 기술지도 종결',
      });
    },
  },

      p.status = 'EXTENSION';

        },

  ext_purchase: {

        sms: (role) => role === 'CONTRACTOR' ? '기술지도 연장 - 산재가입증명서 갱신 제출 요망' : '연장 계약서 갱신 완료',

function pick(o, keys) {
  const r = {};
  for (const k of keys) if (o[k] !== undefined) r[k] = o[k];
  return r;
}

function runAction(p, name, ctx) {
  const a = ACTIONS[name];
  if (!a) throw new WfError('알 수 없는 작업입니다.', 404);
  checkActor(ctx.actor, p, a.roles);
  checkStatus(p, a.statuses);
  a.run(p, ctx);
  p.updatedAt = new Date().toISOString();
  if (p.judgment) p.judgment = { ...p.judgment, ...judge(p, store.get().settlements, settings(), today()) };
  return p;
}

// 현재 사용자에게 화면에 보여줄 수 있는 액션 목록
function availableActions(p, user) {
  return Object.keys(ACTIONS).filter((name) => {
    const a = ACTIONS[name];
    if (!a.statuses.includes(p.status)) return false;
    try { checkActor(user, p, a.roles); return true; } catch { return false; }
  });
}

// ───────────────────────── 일일 점검(스케줄러) ─────────────────────────

function once(p, key) {
  p.flags = p.flags || {};
  if (p.flags[key]) return false;
  p.flags[key] = today();
  return true;
}

function dailyCheck() {
  const db = store.get();
  const t = today();
  const s = settings();
  const results = [];
  for (const p of db.projects) {
    // 판정 갱신(정산실적/기준 변경 반영)
    if (p.status === 'MONITORING' || p.status === 'NOT_TARGET') {
      const r = applyJudgment(p, SYSTEM);
      if (r.becameTarget) results.push(`${p.name}: 기술지도 대상 전환`);
      if (p.status === 'MONITORING' && p.judgment.warning && once(p, `UNIT_WARNING:${t.slice(0, 4)}`)) {
        notifyAndLog(p, 'UNIT_WARNING', ['PARTNER_MGMT', 'SAFETY'], {
          subject: '단가계약 누적 정산금액 주의',
          body: `단가계약 누적 정산금액이 기술지도 기준금액에 근접하였습니다.\n${p.judgment.reason}\n\n운영방안에 따라 누적금액 1억원 미만 관리(작업 단위 세분화) 또는 기술지도 계약 준비를 검토해 주시기 바랍니다.`,
          sms: '단가계약 누계 기준 근접 - 확인 요망',
        }, '단가계약 누계 주의 안내 발송');
        results.push(`${p.name}: 누계 주의 안내`);
      }
      continue;
    }
    if (!['ACTIVE', 'EXTENSION'].includes(p.status)) continue;
    const c = cycleInfo(p, t);
    // 기간 만료 사전 안내 (일반 D-10 / 단가 D-30)
    const days = endNoticeDaysFor(p, s);
    if (c.endIn <= days && c.endIn >= 0 && once(p, `END_NOTICE:${p.guidancePeriod.end}`)) {
      notifyAndLog(p, 'END_NOTICE', [...ALL4(), 'PURCHASE'], {
        subject: `기술지도 기간 만료 ${c.endIn}일 전 안내`,
        body: `재해예방 기술지도 기간이 ${p.guidancePeriod.end}에 만료됩니다(D-${c.endIn}).\n\n - 현장공사 완료 시, 기술지도 종결 조치해 주시기 바랍니다.\n - 기술지도 기간 연장 필요 시, 추가 서류(갱신 계약서, 산재가입증명서 갱신, 기술지도 추가계약서)를 제출해 주시기 바랍니다.`,
        sms: `기술지도 기간 만료 D-${c.endIn} - 종결 또는 연장 조치 요망`,
      }, `기간 만료 D-${c.endIn} 자동 안내 발송`);
      results.push(`${p.name}: 만료 D-${c.endIn} 안내`);
    }
    // 기간 경과
    if (c.endIn < 0 && once(p, `EXPIRED:${p.guidancePeriod.end}`)) {
      notifyAndLog(p, 'EXPIRED', ['PARTNER_MGMT', 'SAFETY', 'PURCHASE'], {
        subject: '기술지도 기간 경과 — 조치 필요',
        body: `기술지도 기간(${p.guidancePeriod.end})이 경과하였으나 종결/연장 조치가 되지 않았습니다.\n현장공사 완료 여부를 확인하여 종결 또는 연장 조치해 주시기 바랍니다.`,
        sms: '기술지도 기간 경과 - 종결/연장 조치 요망',
      }, '기술지도 기간 경과 안내 발송');
      results.push(`${p.name}: 기간 경과 안내`);
    }
    // 15일 주기 점검
    if (c.level === 'warn' && !c.upcoming && once(p, `CYCLE_REMIND:${c.anchor}`)) {
      notifyAndLog(p, 'CYCLE_REMIND', ['AGENCY', 'CONTRACTOR', 'PARTNER_MGMT'], {
        subject: '다음 기술지도 일정 지정 요청',
        body: `직전 기술지도(또는 개시일) ${c.anchor} 이후 다음 기술지도 기한은 ${c.nextDue} 입니다.\n아직 일정이 지정되지 않았습니다.\n협력업체는 작업일자를, 기술지도기관은 지도일자를 지정해 주시기 바랍니다.`,
        sms: `다음 기술지도 기한 ${c.nextDue} - 일정 지정 요망`,
      }, `기술지도 주기 안내 (기한 ${c.nextDue})`);
      results.push(`${p.name}: 주기 안내`);
    }
    if (c.level === 'overdue' && once(p, `CYCLE_OVERDUE:${c.anchor}`)) {
      notifyAndLog(p, 'CYCLE_OVERDUE', ['AGENCY', 'CONTRACTOR', 'PARTNER_MGMT', 'SAFETY'], {
        subject: '기술지도 주기 초과(누락 위험)',
        body: (role) => `기술지도 기한(${c.nextDue})이 경과하였습니다. 기술지도 누락 위험이 있으니 즉시 기술지도를 실시해 주시기 바랍니다.\n(법정 주기: ${s.cycleDays}일 1회 이상)` +
          (role === 'CONTRACTOR' ? '\n\n[협력업체 조치사항] 관리시스템에 기술지도 미실시 사유를 작성해 주시기 바랍니다.' : ''),
        sms: `기술지도 기한(${c.nextDue}) 초과 - 즉시 조치`,
      }, `기술지도 주기 초과 경보 (기한 ${c.nextDue})`);
      results.push(`${p.name}: 주기 초과 경보`);
    }
    // 지도일 경과 후 결과 미제출
    for (const v of p.visits || []) {
      if (v.status === 'SCHEDULED' && dates.diffDays(v.plannedDate, t) >= 2 && once(p, `RESULT_REMIND:${v.id}`)) {
        notifyAndLog(p, 'RESULT_REMIND', ['AGENCY', 'PARTNER_MGMT'], {
          subject: '기술지도 결과보고서 제출 요청',
          body: `${v.plannedDate} ${v.round}회차 기술지도 결과보고서가 아직 제출되지 않았습니다. 현장 기술지도 후 결과보고서를 관리시스템에 제출해 주시기 바랍니다.`,
          sms: `${v.plannedDate} 기술지도 결과보고서 제출 요망`,
        });
        results.push(`${p.name}: 결과 제출 요청`);
      }
    }
  }
  db.meta.lastDailyCheck = { date: t, at: new Date().toISOString(), results };
  store.save();
  return { date: t, results };
}

const DEPARTMENTS_V2 = [
  { id: 'd_pur', name: '구매팀', kind: 'PURCHASE' },
  { id: 'd_maint', name: '정비팀', kind: 'PARTNER_MGMT' },
  { id: 'd_elec', name: '계전팀', kind: 'PARTNER_MGMT' },
  { id: 'd_fac', name: '설비팀', kind: 'PARTNER_MGMT' },
  { id: 'd_prod_pe', name: '생산팀(PE)', kind: 'PARTNER_MGMT' },
  { id: 'd_prod_vcm', name: '생산팀(VCM)', kind: 'PARTNER_MGMT' },
  { id: 'd_prod_pvc1', name: '생산팀(PVC1)', kind: 'PARTNER_MGMT' },
  { id: 'd_prod_pvc2', name: '생산팀(PVC2)', kind: 'PARTNER_MGMT' },
  { id: 'd_prod_plast', name: '생산팀(가소제)', kind: 'PARTNER_MGMT' },
  { id: 'd_safe', name: '안전보건환경팀', kind: 'SAFETY' },
];

function migrate(db) {
  const v = (db.meta && db.meta.version) || 1;
  if (v >= DATA_VERSION) return false;
  db.meta = db.meta || {};
  // 부서: 생산팀을 PE/VCM/PVC1/PVC2/가소제로 세분화(기존 '생산팀'은 사용 중인 공사가 있으면 유지)
  for (const d of DEPARTMENTS_V2) if (!db.departments.some((x) => x.id === d.id || x.name === d.name)) db.departments.push({ ...d });
  const used = new Set(db.projects.map((p) => p.deptId));
  db.departments = db.departments.filter((d) => !(d.id === 'd_prod' && !used.has('d_prod') && !db.users.some((u) => u.orgId === 'd_prod')));
  // 기술지도기관 목록에 '산업안전관리' 추가
  if (!db.agencies.some((a) => a.name.replace(/\s/g, '').includes('산업안전관리'))) db.agencies.push({ id: 'ag_isk', name: '산업안전관리', phone: '', email: '' });
  // 설정: Ver.2 기본값 사용
  if (db.settings) {
    delete db.settings.docTypes;
    delete db.settings.endNoticeDays;
  }
  // 공사: 담당자 구조, 보완 상태 정리, 회차 재정렬
  for (const p of db.projects) {
    p.contacts = p.contacts || {};

async function api(method, url, body) {
  if (window.__TG_LOCAL) return window.__TG_LOCAL.api(method, url, body, S.user);
  const opt = { method, headers: {} };
  if (S.user) opt.headers['x-user-id'] = S.user.id;
  if (body instanceof FormData) opt.body = body;
  else if (body !== undefined) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch('/api' + url, opt);
  const ct = res.headers.get('content-type') || '';
  const data = ct.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || `오류(${res.status})`);
  return data;
}

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 6000 : 3500);
}

async function download(url, fallbackName) {
  if (window.__TG_LOCAL) {
    try { await window.__TG_LOCAL.download(url, S.user); } catch (e) { toast(e.message, 'err'); }
    return;
  }
  try {
    const res = await fetch('/api' + url, { headers: { 'x-user-id': S.user.id } });
    if (!res.ok) throw new Error((await res.json()).error);
    const blob = await res.blob();
    const cd = res.headers.get('content-disposition') || '';
    const m = /filename\*=UTF-8''([^;]+)/.exec(cd);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = m ? decodeURIComponent(m[1]) : fallbackName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { toast(e.message, 'err'); }
}
window.dl = download;

function fileLink(f) {
  return `<a href="#" onclick="dl('/files/${esc(f.id)}','${esc(f.originalName).replace(/'/g, '')}');return false;" title="${esc(f.uploaderName || '')} ${esc((f.uploadedAt || '').slice(0, 10))}">📎 ${esc(f.originalName)}</a>`;
}

function modal(title, bodyHtml, { wide = false, onMount, footer } = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" style="${wide ? 'max-width:1040px' : ''}">
    <div class="hd"><h3>${esc(title)}</h3><button class="x" data-close>×</button></div>
    <div class="bd">${bodyHtml}</div>${footer ? `<div class="ft">${footer}</div>` : ''}</div></div>`;
  const close = () => { root.innerHTML = ''; };
  $$('[data-close]', root).forEach((b) => b.addEventListener('click', close));
  $('.modal-bg', root).addEventListener('mousedown', (e) => { if (e.target.classList.contains('modal-bg')) close(); });
  if (onMount) onMount($('.modal', root), close);
  return close;
}

function trackTab(title, tabLabel) {
  const key = S.route.split('?')[0];
  if (key === '#/dashboard') return;
  const label = tabLabel || title;
  const ex = S.tabs.find((t) => t.key === key);
  if (ex) { ex.route = S.route; ex.label = label; return; }
  S.tabs.push({ key, route: S.route, label });
  if (S.tabs.length > 9) S.tabs.shift();
}

function bindShell() {
  $('#user-switch').addEventListener('change', (e) => login(e.target.value, true));
  const ms = $('#menu-search');
  ms.addEventListener('change', () => {
    const q = ms.value.trim();
    const hit = NAV.find((n) => !n.sep && n.label.includes(q));
    if (q && hit) go(hit.href); else if (q) toast('일치하는 메뉴가 없습니다.', 'err');
  });
  $$('.tab-x').forEach((b) => b.addEventListener('click', (e) => {
    e.preventDefault();
    const i = Number(b.dataset.tab);
    const closing = S.tabs[i];
    S.tabs.splice(i, 1);
    if (closing && closing.key === S.route.split('?')[0]) go(S.tabs.length ? S.tabs[S.tabs.length - 1].route : '#/dashboard');
    else render();
  }));
  // 포틀릿 새로고침 버튼
  $$('.content .panel > .hd').forEach((hd) => {
    if (hd.querySelector('.portlet-tools')) return;
    const t = document.createElement('span');
    t.className = 'portlet-tools';
    t.innerHTML = '<button type="button" title="새로고침">↻</button>';
    t.querySelector('button').addEventListener('click', () => render());
    hd.appendChild(t);
  });
  $('#logout').addEventListener('click', () => { LS.del('tg_user'); S.user = null; render(); });
  api('GET', '/dashboard').then((d) => {
    const b = $('#unread-badge');
    if (b && d.unread) { b.textContent = d.unread; b.hidden = false; }
  }).catch(() => {});
}

async function login(uid, keepRoute) {
  S.user = S.meta.users.find((u) => u.id === uid) || null;
  if (S.user) LS.set('tg_user', uid);
  if (!keepRoute) S.route = '#/dashboard';
  render();
}

async function loadMeta() { S.meta = await api('GET', '/meta'); }

async function render() {
  const app = $('#app');
  if (!S.meta) await loadMeta();
  if (!S.user) { app.innerHTML = loginView(); bindLogin(); return; }
  const [, page, id] = (S.route || '#/dashboard').split('?')[0].split('/');
  const pages = { dashboard: pageDashboard, projects: id ? () => pageProject(id) : pageProjects, settlements: pageSettlements, calendar: pageCalendar, notifications: pageNotifications, flow: pageFlow, admin: pageAdmin };
  const fn = pages[page] || pageDashboard;
  try {
    await fn();
  } catch (e) {
    app.innerHTML = shell('오류', `<div class="alert danger">${esc(e.message)}</div>`);
    bindShell();
  }
}
// 화면 이동: 내부 라우팅(S.route). 서버 실행 시 주소창 해시도 함께 갱신한다.
S.route = (!window.__TG_LOCAL && location.hash.startsWith('#/')) ? location.hash : '#/dashboard';
function go(route) {
  S.route = route;
  if (!window.__TG_LOCAL) { try { history.replaceState(null, '', route); } catch { /* 무시 */ } }
  $('#modal-root').innerHTML = '';
  render();
  window.scrollTo(0, 0);
}
window.go = go;
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#/"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); }
});

// 브라우저 confirm()을 쓰지 않는 확인 창
function askConfirm(message, okLabel = '확인') {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    modal('확인', `<div style="line-height:1.6">${esc(message)}</div>`, {
      footer: `<button class="btn" data-close>취소</button><button class="btn primary" id="confirm-ok">${esc(okLabel)}</button>`,
      onMount(el, close) {
        $('#confirm-ok', el).addEventListener('click', () => { finish(true); close(); });
        new MutationObserver((m, obs) => { if (!el.isConnected) { obs.disconnect(); finish(false); } }).observe($('#modal-root'), { childList: true });
      },
    });
  });
}

  bindShell();
  $('#f-type').value = f.type; $('#f-judge').value = f.judge; $('#f-status').value = f.status; $('#f-kw').value = f.kw;
  const draw = () => {
    const ft = $('#f-type').value, fj = $('#f-judge').value, fs = $('#f-status').value, kw = $('#f-kw').value.trim().toLowerCase();
    const rows = list.filter((p) => (!ft || p.type === ft) && (!fs || p.status === fs)
      && (!fj || (fj === 'Y' ? p.judgment?.target : fj === 'W' ? (!p.judgment?.target && p.judgment?.warning) : !p.judgment?.target))
      && (!kw || `${p.name} ${p.companyName} ${p.contractNo}`.toLowerCase().includes(kw)));
    $('#cnt').textContent = `${rows.length}건`;
    $('#tbl').innerHTML = rows.length ? `<table class="tbl"><thead><tr>
      <th>구분</th><th>공사계약명 / 계약번호</th><th>업체명</th><th>계약기간</th><th class="num">계약금액</th><th class="num">누계 정산(당해)</th><th>판정결과</th><th>진행상태</th><th>현재 담당</th><th>다음 지도기한</th></tr></thead><tbody>
      ${rows.map((p) => {
        const cum = p.judgment?.cumulative;

        const owner = [...new Set(p.tasks.map((t) => roleLabel(t.role)))].join(', ');

        <td class="num">${won(p.amount)}</td>
        <td class="num">${p.type === 'UNIT_PRICE' ? `${won(cum?.currentYearAmount || 0)}<div class="bar ${ratio >= 1 ? 'over' : p.judgment?.warning ? 'warn' : ''}" style="margin-top:4px"><i style="width:${Math.min(100, ratio * 100)}%"></i></div><span class="small muted">${(ratio * 100).toFixed(1)}%</span>` : '<span class="muted">-</span>'}</td>
        <td>${judgeBadge(p)}</td>

      }).join('')}</tbody></table>` : '<div class="empty">조건에 맞는 공사가 없습니다.</div>';
    $$('#tbl tr[data-id]').forEach((tr) => tr.addEventListener('click', () => { go(`#/projects/${tr.dataset.id}`); }));
  };
  ['#f-type', '#f-judge', '#f-status'].forEach((s) => $(s).addEventListener('change', draw));
  $('#f-kw').addEventListener('input', draw);
  draw();
  $('#export').addEventListener('click', () => download('/export/projects.xlsx', '기술지도_대상공사.xlsx'));
  if (canCreate) $('#new').addEventListener('click', openRegister);
}

// 역할·소속별 사용자 선택 목록
function userOptions(role, orgId, selected, placeholder = '담당자 선택') {
  const list = S.meta.users.filter((u) => u.role === role && u.active !== false && (orgId === undefined || u.orgId === orgId));
  return `<option value="">${esc(placeholder)}</option>${list.map((u) => `<option value="${u.id}" ${u.id === selected ? 'selected' : ''}>${esc(u.name)}${u.title ? ` (${esc(u.title)})` : ''}</option>`).join('')}`;
}

// 금액 입력 아래에 X.XX억 (XX,XXX원) 표시
function bindAmountHints(root) {
  $$('[data-amount]', root).forEach((inp) => {
    const hint = document.createElement('div');
    hint.className = 'field-note amount-hint';
    inp.insertAdjacentElement('afterend', hint);
    const upd = () => { const n = Number(String(inp.value).replace(/[^\d]/g, '')); hint.textContent = n ? `${(n / 1e8).toFixed(2)}억 (${n.toLocaleString('ko-KR')}원)` : ''; };
    inp.addEventListener('input', upd);
    inp.addEventListener('blur', () => { const n = Number(String(inp.value).replace(/[^\d]/g, '')); if (n) inp.value = n.toLocaleString('ko-KR'); upd(); });
    upd();
  });
}

// 파일 끌어다 놓기(Drag & Drop) 입력
function dropField(name, label, { multiple = false, required = false, hint = '' } = {}) {
  return `<div class="dz-field" data-dz><input type="file" name="${name}" ${multiple ? 'multiple' : ''} hidden>
    <div class="dz" tabindex="0" role="button"><span class="dz-ico">⇪</span><div><b>${esc(label)}</b>${required ? ' <span class="dz-req">필수</span>' : ''}
    <div class="small muted">${hint ? `${esc(hint)} · ` : ''}파일을 끌어다 놓거나 클릭하여 선택${multiple ? ' (여러 개 가능)' : ''}</div><ul class="dz-list"></ul></div></div></div>`;
}

function bindDropzones(root) {
  $$('[data-dz]', root).forEach((wrap) => {
    const inp = $('input[type=file]', wrap);
    const dz = $('.dz', wrap);
    const list = $('.dz-list', wrap);
    const show = () => {
      list.innerHTML = [...inp.files].map((f) => `<li>📎 ${esc(f.name)} <span class="muted">(${Math.max(1, Math.round(f.size / 1024))}KB)</span></li>`).join('');
      wrap.classList.toggle('has-file', inp.files.length > 0);
      wrap.dispatchEvent(new CustomEvent('dz-change', { bubbles: true, detail: { files: [...inp.files] } }));
    };
    const setFiles = (files) => {
      const dt = new DataTransfer();
      if (inp.multiple) for (const f of inp.files) dt.items.add(f);
      for (const f of (inp.multiple ? files : [...files].slice(0, 1))) dt.items.add(f);
      inp.files = dt.files;
      show();
    };
    dz.addEventListener('click', () => inp.click());
    dz.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
    inp.addEventListener('change', show);
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files.length) setFiles(e.dataTransfer.files); });
  });
}

// data-act 버튼: 가장 가까운 .action-card 안의 입력값을 모아 작업을 실행
function bindActs(root, p, after) {
  $$('[data-act]', root).forEach((btn) => btn.addEventListener('click', async () => {
    const act = btn.dataset.act;
    if (btn.dataset.confirm && !(await askConfirm(btn.dataset.confirm))) return;
    const scope = btn.closest('.action-card') || root;
    const fd = new FormData();
    $$('input, select, textarea', scope).forEach((el) => {
      if (!el.name || el.disabled) return;
      if (el.type === 'file') { for (const f of el.files) fd.append(el.name, f); return; }
      if (el.type === 'checkbox') { if (el.checked) fd.append(el.name, el.value === 'on' ? 'true' : el.value); return; }
      if (el.name.startsWith('note_')) return;
      fd.append(el.name, el.value);
    });
    if (btn.dataset.note) { const n = $(`[name="${btn.dataset.note}"]`, scope); if (n) fd.append('note', n.value); }
    if (btn.dataset.visit) fd.append('visitId', btn.dataset.visit);
    btn.disabled = true;
    try {
      await api('POST', `/projects/${p.id}/actions/${act}`, fd);
      toast(`${S.meta.actions[act]?.label || act} 완료`, 'ok');
      if (btn.closest('#modal-root')) $('#modal-root').innerHTML = '';
      if (after) after();
      await loadMeta();
      render();
    } catch (e) { toast(e.message, 'err'); btn.disabled = false; }
  }));
}

// ① 계약서 Upload → ② 자동 추출 확인/수정 → ③ 등록(자동 판정·안내)
function openRegister() {

  const deptOpts = m.departments.filter((d) => d.kind === 'PARTNER_MGMT').map((d) => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  const defAg = m.settings.defaultAgencyId || '';

        <div class="small muted" style="margin-top:6px">PDF · DOCX · HWPX · XLSX · TXT · JPG/PNG 지원 — 계약서에서 공사계약명/업체명/계약기간/계약금액을 자동 추출합니다. 스캔 PDF·사진은 OCR(문자 인식)로 읽습니다.</div>

      <div style="text-align:center;margin-top:10px"><a href="#" id="manual">계약서 없이 직접 입력하기</a></div>
    </div>
    <div id="reg-step2" hidden>
      <div id="extract-msg"></div>
      <h4 class="form-sec">공사 계약 정보</h4>
      <div class="form">
        <label class="req">공사 구분</label><div><select id="r-type"><option value="GENERAL">일반공사</option><option value="UNIT_PRICE">단가계약</option></select><div class="evidence" id="ev-type"></div></div>
        <label class="req">공사계약명</label><div><input id="r-name"><div class="evidence" id="ev-name"></div></div>
        <label>계약번호</label><div><input id="r-contractNo"><div class="evidence" id="ev-contractNo"></div></div>
        <label class="req">업체명</label><div><input id="r-companyName" list="comp-list"><datalist id="comp-list">${m.companies.map((c) => `<option value="${esc(c.name)}">`).join('')}</datalist><div class="evidence" id="ev-companyName"></div></div>
        <label class="req">계약기간</label><div><div class="btn-row"><input type="date" id="r-startDate"> ~ <input type="date" id="r-endDate"></div><div class="evidence" id="ev-period"></div></div>
        <label class="req">계약금액(원)</label><div><input id="r-amount" inputmode="numeric"><div class="field-note" id="amt-kor"></div><div class="evidence" id="ev-amount"></div></div>
      </div>
      <h4 class="form-sec">관리부서 · 담당자 지정 <span class="small muted">— 대상 판정 시 지정된 담당자에게 자동 안내(미지정 역할은 소속 전체에 안내)</span></h4>
      <div class="form">
        <label class="req">협력업체 관리부서</label><div class="btn-row"><select id="r-deptId"><option value="">부서 선택</option>${deptOpts}</select><select id="r-managerUserId"><option value="">담당자 선택</option></select></div>
        <label>안전보건환경 담당자</label><select id="r-contact_SAFETY">${userOptions('SAFETY', undefined, '')}</select>
        <label>기술지도기관</label><div class="btn-row"><select id="r-agencyId"><option value="">미지정</option>${m.agencies.map((a) => `<option value="${a.id}" ${a.id === defAg ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select><select id="r-contact_AGENCY">${userOptions('AGENCY', defAg, '')}</select></div>
        <label>협력업체 담당자</label><div><select id="r-contact_CONTRACTOR"><option value="">업체명을 먼저 입력하세요</option></select>
          <div class="btn-row" style="margin-top:6px"><input id="r-new_CONTRACTOR_name" placeholder="신규 담당자 이름" style="width:130px"><input id="r-new_CONTRACTOR_phone" placeholder="휴대폰" style="width:140px"><input id="r-new_CONTRACTOR_email" placeholder="이메일" style="width:190px"></div>
          <div class="field-note">목록에 없으면 이름·연락처를 입력하세요. 협력업체 담당자로 등록되어 안내를 받습니다.</div></div>
      </div>
      <div id="preview"></div>
      <details style="margin-top:12px"><summary class="small muted">추출된 계약서 텍스트 보기</summary><pre class="mail-body" id="raw" style="max-height:220px;overflow:auto"></pre></details>
    </div>`;
  modal('신규 공사 등록', body, {
    wide: true,
    footer: '<button class="btn" data-close>취소</button><button class="btn primary" id="reg-save" hidden>등록 및 대상여부 판정</button>',
    onMount(el, close) {
      const dz = $('#dz', el), fi = $('#cfile', el);
      const showStep2 = () => { $('#reg-step1', el).hidden = true; $('#reg-step2', el).hidden = false; $('#reg-save', el).hidden = false; };
      const norm = (s) => String(s || '').replace(/\(주\)|㈜|주식회사|\s/g, '');
      const syncContractor = () => {
        const c = m.companies.find((x) => norm(x.name) === norm($('#r-companyName', el).value));
        $('#r-contact_CONTRACTOR', el).innerHTML = c ? userOptions('CONTRACTOR', c.id, '', '등록된 담당자 선택') : '<option value="">등록된 업체가 아닙니다 — 아래에 신규 담당자를 입력하세요</option>';
      };
      const fill = () => {
        const f = extracted.fields || {}, ev = extracted.evidence || {};
        for (const k of ['name', 'contractNo', 'companyName', 'startDate', 'endDate', 'amount']) {
          const inp = $(`#r-${k}`, el);
          if (f[k] != null) { inp.value = k === 'amount' ? Number(f[k]).toLocaleString('ko-KR') : f[k]; inp.classList.add('hl'); }
        }
        if (f.type) { $('#r-type', el).value = f.type; if (ev.type) $('#r-type', el).classList.add('hl'); }
        for (const k of ['name', 'contractNo', 'companyName', 'period', 'amount', 'type']) if (ev[k]) $(`#ev-${k}`, el).textContent = `근거: ${ev[k]}`;
        $('#raw', el).textContent = extracted.textPreview || '(없음)';
        const miss = (extracted.missing || []).map((k) => ({ name: '공사계약명', companyName: '업체명', startDate: '계약 시작일', endDate: '계약 종료일', amount: '계약금액' }[k]));
        $('#extract-msg', el).innerHTML = (extracted.notice ? `<div class="alert info">🔍 ${esc(extracted.notice)}</div>` : '') + (extracted.warning ? `<div class="alert warn">${esc(extracted.warning)}</div>`
          : token ? `<div class="alert ${miss.length ? 'warn' : 'ok'}">${miss.length ? `일부 항목을 찾지 못했습니다: <b>${esc(miss.join(', '))}</b> — 직접 입력해 주세요.` : '계약서에서 필요 정보를 추출했습니다.'} <span class="small">(노란색 = 자동 추출값, 반드시 확인 후 등록)</span></div>` : '');
        syncContractor();
        preview();
      };
      const preview = () => {
        const amount = Number($('#r-amount', el).value.replace(/[^\d]/g, ''));
        $('#amt-kor', el).textContent = amount ? `${eok(amount)} (${amount.toLocaleString('ko-KR')}원)` : '';
        const s = $('#r-startDate', el).value, e = $('#r-endDate', el).value, t = $('#r-type', el).value;
        const th = m.settings.amountThreshold;
        if (!s || !e || !amount) { $('#preview', el).innerHTML = ''; return; }
        const addM = (d, n) => { const x = new Date(d + 'T00:00:00Z'); const day = x.getUTCDate(); x.setUTCDate(1); x.setUTCMonth(x.getUTCMonth() + n); const last = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate(); x.setUTCDate(Math.min(day, last)); return x.toISOString().slice(0, 10); };
        const pOk = addDays(addM(s, m.settings.periodMonths), -1) <= e;
        let html;
        if (t === 'GENERAL') {
          const ok = pOk && amount >= th;
          html = `<div class="alert ${ok ? 'danger' : 'ok'}"><b>판정 미리보기: ${ok ? '기술지도 대상' : '대상 아님'}</b> — 공사기간 ${pOk ? '1개월 이상 ✔' : '1개월 미만 ✖'}, 공사금액 ${amount >= th ? '1억 이상 ✔' : '1억 미만 ✖'}</div>`;
        } else {
          html = amount >= th ? '<div class="alert danger"><b>판정 미리보기: 기술지도 대상</b> — 단가계약 계약금액 1억원 이상</div>'
            : '<div class="alert info"><b>판정 미리보기: 대상 아님(누계 관리)</b> — 계약금액 1억원 미만. 월별 정산실적 Upload 시 연간 누계 1억원 이상이면 자동으로 대상 전환됩니다.</div>';
        }
        $('#preview', el).innerHTML = html;
      };
      const analyze = async (file) => {
        dz.innerHTML = '<div style="font-size:28px">⏳</div><b>계약서 분석 중...</b><div class="small muted" style="margin-top:6px">스캔 PDF·사진은 OCR(문자 인식)로 읽어 쪽당 5~20초 걸릴 수 있습니다.</div>';
        const fd = new FormData(); fd.append('file', file);
        try {
          extracted = await api('POST', '/contracts/analyze', fd);
          token = extracted.token;
          showStep2(); fill();
          $('#extract-msg', el).insertAdjacentHTML('afterbegin', `<div class="small muted" style="margin-bottom:6px">📎 ${esc(extracted.fileName)}</div>`);
        } catch (e) { toast(e.message, 'err'); close(); }
      };
      dz.addEventListener('click', () => fi.click());
      fi.addEventListener('change', () => fi.files[0] && analyze(fi.files[0]));
      dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('over'));
      dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) analyze(e.dataTransfer.files[0]); });
      $('#manual', el).addEventListener('click', (e) => { e.preventDefault(); showStep2(); fill(); });
      ['#r-amount', '#r-startDate', '#r-endDate', '#r-type'].forEach((s) => $(s, el).addEventListener('input', preview));
      $('#r-type', el).addEventListener('change', preview);
      $('#r-companyName', el).addEventListener('input', syncContractor);
      $('#r-amount', el).addEventListener('blur', (e) => { const n = Number(e.target.value.replace(/[^\d]/g, '')); if (n) e.target.value = n.toLocaleString('ko-KR'); });
      $('#r-deptId', el).addEventListener('change', (e) => { $('#r-managerUserId', el).innerHTML = userOptions('PARTNER_MGMT', e.target.value, ''); });
      $('#r-agencyId', el).addEventListener('change', (e) => { $('#r-contact_AGENCY', el).innerHTML = userOptions('AGENCY', e.target.value, ''); });
      $('#reg-save', el).addEventListener('click', async () => {
        if (!$('#r-deptId', el).value) { toast('협력업체 관리부서를 선택해 주세요.', 'err'); $('#r-deptId', el).focus(); return; }
        const fd = new FormData();
        for (const k of ['type', 'name', 'contractNo', 'companyName', 'startDate', 'endDate', 'amount', 'deptId', 'managerUserId', 'agencyId', 'contact_SAFETY', 'contact_AGENCY', 'contact_CONTRACTOR', 'new_CONTRACTOR_name', 'new_CONTRACTOR_phone', 'new_CONTRACTOR_email']) fd.append(k, $(`#r-${k}`, el).value.trim());
        if (token) fd.append('token', token);
        try {
          const p = await api('POST', '/projects', fd);
          close();
          toast(p.judgment.target ? '등록 완료 — 기술지도 대상으로 판정되어 지정된 담당자에게 자동 안내를 발송했습니다.' : `등록 완료 — ${p.statusLabel}`, 'ok');
          await loadMeta();
          go(`#/projects/${p.id}`);
        } catch (e) { toast(e.message, 'err'); }
      });
    },
  });
}

const STEPS = [
  { key: 1, label: '공사 등록·판정', who: '구매/시스템' },
  { key: 3, label: '서류 제출', who: '협력업체' },
  { key: 4, label: '기술지도 계약서', who: '기술지도기관' },
  { key: 5, label: '기술지도 진행', who: '기관·협력업체' },
  { key: 6, label: '기간 연장', who: '구매·협력업체·기관', optional: true },
  { key: 7, label: '종결', who: '협력업체 관리부서' },
];

function stepper(p) {
  if (p.status === 'NOT_TARGET' || p.status === 'MONITORING') {
    return `<div class="stepper"><div class="step cur"><div class="dot">✓</div><div class="lb">공사 등록·판정</div><div class="who">${p.status === 'MONITORING' ? '누계 관리 중' : '대상 아님'}</div></div></div>`;
  }
  const cur = p.step;
  const extended = (p.extensions || []).length > 0 || p.status === 'EXTENSION';
  return `<div class="stepper">${STEPS.map((s) => {
    let cls = s.key < cur ? 'done' : s.key === cur ? 'cur' : '';
    if (s.key === 6 && !extended && cur !== 6) cls = 'skip';
    if (s.key === 6 && extended && cur !== 6) cls = 'done';
    if (cur === 7 && s.key === 7) cls = 'done cur';
    return `<div class="step ${cls}"><div class="dot">${cls.includes('done') ? '✓' : STEPS.indexOf(s) + 1}</div><div class="lb">${s.label}${s.optional ? ' (필요시)' : ''}</div><div class="who">${s.who}</div></div>`;
  }).join('')}</div>`;
}

const HELD = ['DONE', 'IMPROVEMENT_REQUESTED', 'IMPROVEMENT_SUBMITTED', 'CLOSED_OK'];

  const info = `<dl class="kv kv-4">

      <dt>고용노동부 시스템</dt><dd>${p.tgContract.moelSubmitted ? badge('계약서 등록 완료', 'green') : badge('미등록', 'orange')}
      ${A.has('set_moel') ? `<span class="action-card inline"><label class="small"><input type="checkbox" name="moelSubmitted" ${p.tgContract.moelSubmitted ? 'checked' : ''}> 등록 완료</label> <button class="btn sm" data-act="set_moel">저장</button></span>` : ''}</dd>` : ''}
    ${p.closed ? `<dt>종결</dt><dd>현장공사 완료 ${esc(p.closed.completionDate)} (${esc(p.closed.by)})</dd>` : ''}

  // 판정 패널
  let judgeHtml = `<div class="alert ${j.target ? 'danger' : j.warning ? 'warn' : 'ok'}"><div><b>${j.target ? '재해예방 기술지도 대상' : '기술지도 대상 아님'}</b><br><span class="small">${esc(j.reason || '')}</span><div class="small muted">판정일 ${esc(j.judgedAt || '')}</div></div></div>`;
  if (p.type === 'UNIT_PRICE') {
    const th = m.settings.amountThreshold;
    const yr = j.cumulative?.currentYear || today().slice(0, 4);
    const cum = j.cumulative?.currentYearAmount || 0;
    const ratio = cum / th;
    const months = {};
    for (const s of p.settlements) if (s.month.startsWith(yr)) months[s.month.slice(5)] = s.amount;
    judgeHtml += `<div class="small" style="margin:8px 0 4px"><b>${yr}년 누적 정산금액</b> ${won(cum)} / 기준 ${won(th)} (${(ratio * 100).toFixed(1)}%)${j.forecast ? ` · 연말 예상 ${won(j.forecast)}` : ''}</div>
      <div class="bar ${ratio >= 1 ? 'over' : j.warning ? 'warn' : ''}"><i style="width:${Math.min(100, ratio * 100)}%"></i></div>
      <div class="tbl-wrap" style="margin-top:10px"><table class="tbl small"><thead><tr>${Array.from({ length: 12 }, (_, i) => `<th class="num">${i + 1}월</th>`).join('')}</tr></thead><tbody><tr>${Array.from({ length: 12 }, (_, i) => { const v = months[String(i + 1).padStart(2, '0')]; return `<td class="num">${v != null ? (v / 1e4).toLocaleString('ko-KR') : '<span class="muted">-</span>'}</td>`; }).join('')}</tr></tbody></table><div class="small muted">단위: 만원 · 정산실적은 '단가계약 정산·누계' 메뉴에서 Upload</div></div>`;

  // 할 일
  const tasksHtml = p.tasks.length ? p.tasks.map((t) => `<div class="task ${isMine(t.role) ? 'mine' : ''} ${t.urgent ? 'urgent' : ''}">${badge(roleLabel(t.role), isMine(t.role) ? 'orange' : 'gray')}<span class="t">${esc(t.label)}</span></div>`).join('')
    : `<div class="muted small">${p.status === 'CLOSED' ? '종결된 공사입니다.' : p.status === 'NOT_TARGET' ? '기술지도 대상이 아닙니다.' : '대기 중인 업무가 없습니다.'}</div>`;

  // 주기
  const c = p.cycle;
  const cycleHtml = c ? `<div class="alert ${c.level === 'overdue' || c.level === 'expired' ? 'danger' : c.level === 'warn' ? 'warn' : 'ok'}"><div>
    <b>기술지도 주기(${m.settings.cycleDays}일 1회) 점검</b><br>

  // 기술지도 일정·결과보고서(누적)

  const visitsHtml = visits.length ? `<table class="tbl"><thead><tr><th>회차</th><th>지도일</th><th>상태</th><th>기술지도 결과보고서</th></tr></thead><tbody>${visits.map((v) => {
    const vf = p.files.filter((f) => f.ref === v.id);
    const vc = { SCHEDULED: 'blue', DONE: 'green', CANCELED: 'gray' }[v.status] || 'green';
    return `<tr><td class="nowrap c">${v.status === 'CANCELED' ? '-' : `${v.round}회차`}</td><td class="nowrap">${esc(v.actualDate || v.plannedDate)} ${esc(v.time || '')}<div class="small muted">${esc(v.inspector || '')}</div></td>
      <td>${badge(m.visitStatus[v.status] || '지도 완료', vc)}${v.status === 'CANCELED' && v.cancelNote ? `<div class="small muted">${esc(v.cancelNote)}</div>` : ''}</td>
      <td class="chip-files">${vf.map(fileLink).join('') || '<span class="muted small">-</span>'}</td></tr>`;
  }).join('')}</tbody></table>` : '<div class="empty">기술지도 이력이 없습니다.</div>';

  // 미실시(주기 초과) 현황
  const gaps = p.gaps || [];
  const gapsHtml = gaps.length ? `<table class="tbl small"><thead><tr><th>월</th><th>주기 기한</th><th>구간</th><th>미실시 사유</th></tr></thead><tbody>${gaps.map((g) => `<tr><td class="c">${esc(g.month)}</td><td class="nowrap">${esc(g.due)}</td><td class="nowrap">${esc(g.from)} → ${g.until ? esc(g.until) : (g.ongoing ? '<b style="color:var(--red)">초과 중</b>' : '종결')}</td>
    <td>${g.reason ? `${badge(g.reason.label, 'gray')}${g.reason.text ? ` ${esc(g.reason.text)}` : ''}<div class="muted">${esc(g.reason.by)} · ${esc(g.reason.at)}</div>` : '<span style="color:var(--red)">미작성</span>'}</td></tr>`).join('')}</tbody></table>` : '';

  // 제출 서류
  const extFiles = p.files.filter((f) => f.category.startsWith('EXT'));
  const docsHtml = `<table class="tbl"><thead><tr><th>구분</th><th>파일</th></tr></thead><tbody>
    <tr><td class="nowrap">해당공사 공사 계약서 <span class="small muted">(등록 시 첨부분 자동 제출)</span></td><td class="chip-files">${contractFile ? fileLink(contractFile) : '<span class="muted small">등록 시 첨부된 계약서 없음</span>'}</td></tr>
    ${m.settings.docTypes.map((d) => { const fs = p.files.filter((f) => f.ref === 'DOCS' && f.category === d.key); return `<tr><td class="nowrap">${esc(d.label)} ${d.required ? '<span class="small" style="color:var(--red)">필수</span>' : ''}</td><td class="chip-files">${fs.length ? fs.map(fileLink).join('') : '<span class="muted small">미제출</span>'}</td></tr>`; }).join('')}
    <tr><td>기술지도 계약서</td><td class="chip-files">${fby('TG_CONTRACT').map(fileLink).join('') || '<span class="muted small">-</span>'}</td></tr>
    <tr><td>기술지도 결과보고서 <span class="small muted">(누적 ${reports}건)</span></td><td class="chip-files">${fby('TG_RESULT').map(fileLink).join('') || '<span class="muted small">-</span>'}</td></tr>
    ${extFiles.length ? `<tr><td>연장 관련서류</td><td class="chip-files">${extFiles.map(fileLink).join('')}</td></tr>` : ''}
  </tbody></table>`;

  const hist = `<ul class="timeline">${[...(p.history || [])].reverse().map((h) => `<li class="${h.role === 'SYSTEM' ? 'sys' : ''}"><b>${esc(h.label)}</b><div class="meta">${esc(h.date)} · ${esc(h.userName)} (${esc(roleLabel(h.role))})</div>${h.note ? `<div class="note">${esc(h.note)}</div>` : ''}</li>`).join('')}</ul>`;

  const notis = p.notifications.filter((n) => n.channel === 'EMAIL');
  const notiHtml = notis.length ? `<ul class="list">${notis.slice(0, 40).map((n) => `<li><span>✉️</span><div class="grow"><div><b>${esc(n.subject)}</b></div><div class="small muted">${esc(n.date)} → ${esc(n.toName)} (${esc(roleLabel(n.toRole))}) ${esc(n.toAddr)} · SMS 동시발송</div><details><summary class="small">내용</summary><div class="mail-body">${esc(n.body)}</div></details></div></li>`).join('')}</ul>` : '<div class="empty">발송 내역이 없습니다.</div>';

      <div>
        <div class="panel"><div class="hd"><h3>처리할 업무</h3><span class="sub">노란색 = 현재 사용자(${esc(roleLabel(S.user.role))}) 담당</span></div><div class="bd">${tasksHtml}</div></div>
